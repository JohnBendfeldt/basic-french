<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="45%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>

    <!-- Glowing Atmospheric Orbs -->
    <radialGradient id="blueGlow" cx="20%" cy="25%" r="60%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="85%" cy="75%" r="55%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0"/>
    </radialGradient>

    <!-- French Tricolor Accent Gradient -->
    <linearGradient id="flagAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>

    <!-- French Flag Clip Path -->
    <clipPath id="frFlagClip">
      <rect x="0" y="0" width="45" height="30" rx="3"/>
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing Atmospheric Orbs -->
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>

  <!-- Top Decorative Accent Strip -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#flagAccent)"/>

  <!-- Bottom Accent Strip -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#flagAccent)"/>

  <!-- Left Column: Branding & Features -->
  <!-- School Crest Emblem (68x68) -->
  <g transform="translate(80, 80)">
    <circle cx="34" cy="34" r="34" fill="#2563eb" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <circle cx="34" cy="34" r="30" fill="#1e40af"/>
    <!-- Graduation Cap -->
    <path d="M34 16 L14 26 L34 36 L54 26 Z" fill="url(#goldGrad)"/>
    <path d="M22 31.5 V43 C22 47 27 50 34 50 C41 50 46 47 46 43 V31.5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M54 27 V40" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Domain Badge -->
  <rect x="170" y="93" width="215" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="277.5" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#fde047" text-anchor="middle" letter-spacing="0.5">basicfrench.org</text>

  <!-- French Vertical Tricolor Flag Badge next to domain -->
  <g transform="translate(400, 99)">
    <g clip-path="url(#frFlagClip)">
      <rect x="0" y="0" width="15" height="30" fill="#002654"/>
      <rect x="15" y="0" width="15" height="30" fill="#ffffff"/>
      <rect x="30" y="0" width="15" height="30" fill="#ed2939"/>
    </g>
    <rect x="0" y="0" width="45" height="30" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="3"/>
  </g>

  <!-- App Title -->
  <text x="80" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    Basic French
  </text>

  <!-- Tagline -->
  <text x="83" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">
    Free Online French for Beginners
  </text>

  <!-- Underline Accent Bar -->
  <rect x="80" y="325" width="560" height="5" rx="2.5" fill="url(#flagAccent)"/>

  <!-- Subtitle Description (Clean 2-line layout) -->
  <text x="83" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">
    Master French alphabet phonetics, essential vocabulary,
  </text>
  <text x="83" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">
    numbers &amp; time, and accent-smart quizzes.
  </text>

  <!-- Feature Pills (Row 1) -->
  <g transform="translate(80, 435)">
    <!-- Pill 1: Alphabet & IPA -->
    <rect x="0" y="0" width="195" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <text x="97.5" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="middle">🔤 Alphabet &amp; IPA</text>

    <!-- Pill 2: Essential Phrases -->
    <rect x="207" y="0" width="195" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <text x="304.5" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="middle">💬 Essential Phrases</text>

    <!-- Pill 3: Numbers & Time -->
    <rect x="414" y="0" width="180" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <text x="504" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="middle">🔢 Numbers &amp; Time</text>
  </g>

  <!-- Feature Pills (Row 2) -->
  <g transform="translate(80, 495)">
    <!-- Pill 4: Adaptive Quizzes -->
    <rect x="0" y="0" width="185" height="44" rx="22" fill="rgba(37, 99, 235, 0.35)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="92.5" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#bfdbfe" text-anchor="middle">🎯 Adaptive Quizzes</text>

    <!-- Pill 5: Neural TTS Audio -->
    <rect x="197" y="0" width="205" height="44" rx="22" fill="rgba(239, 68, 68, 0.25)" stroke="#f87171" stroke-width="1.2"/>
    <text x="299.5" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#fecaca" text-anchor="middle">🔊 Neural TTS Audio</text>

    <!-- Pill 6: PWA & Mobile -->
    <rect x="414" y="0" width="180" height="44" rx="22" fill="rgba(245, 158, 11, 0.25)" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="504" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#fef3c7" text-anchor="middle">📱 PWA &amp; Mobile</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="740" y1="70" x2="740" y2="550" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Right Column: French Phonetics & Accents Showcase -->
  <g transform="translate(770, 70)">
    <!-- Card 1: Letter É -->
    <g transform="translate(0, 20)">
      <rect width="180" height="200" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
      <text x="90" y="115" font-family="Georgia, serif" font-size="95" font-weight="bold" fill="#ffffff" text-anchor="middle">É</text>
      <text x="90" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600" fill="#60a5fa" text-anchor="middle">/e/ · accent aigu</text>
      <text x="90" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">été (summer)</text>
    </g>

    <!-- Card 2: Letter Ç -->
    <g transform="translate(200, 20)">
      <rect width="180" height="200" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
      <text x="90" y="115" font-family="Georgia, serif" font-size="95" font-weight="bold" fill="#ffffff" text-anchor="middle">Ç</text>
      <text x="90" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600" fill="#f87171" text-anchor="middle">/s/ · cédille</text>
      <text x="90" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">ça va (how&apos;s it going)</text>
    </g>

    <!-- Card 3: Letter È -->
    <g transform="translate(0, 245)">
      <rect width="180" height="200" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
      <text x="90" y="115" font-family="Georgia, serif" font-size="95" font-weight="bold" fill="#ffffff" text-anchor="middle">È</text>
      <text x="90" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600" fill="#fbbf24" text-anchor="middle">/ɛ/ · accent grave</text>
      <text x="90" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">frère (brother)</text>
    </g>

    <!-- Card 4: Letter Œ -->
    <g transform="translate(200, 245)">
      <rect width="180" height="200" rx="18" fill="rgba(37,99,235,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
      <text x="90" y="115" font-family="Georgia, serif" font-size="95" font-weight="bold" fill="#60a5fa" text-anchor="middle">Œ</text>
      <text x="90" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600" fill="#fde047" text-anchor="middle">/œ/ · ligature</text>
      <text x="90" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">cœur (heart)</text>
    </g>
  </g>
</svg>
